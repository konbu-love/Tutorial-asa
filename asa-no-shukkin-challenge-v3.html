<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>朝の出勤チャレンジ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@700;900&display=swap');

  :root{
    --navy: #16204A;
    --navy2: #23306B;
    --gold: #E8C15A;
    --gold-dim: #B99A46;
    --paper: #F4EFE0;
    --red: #C64545;
    --blue-hl: #4F8FE8;
    --good: #4CAF6D;
    --tatami: #5E7A3D;
    --tatami-dark: #4A6230;
    --floor: #A9784F;
    --floor-dark: #8C6239;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    font-family:'DotGothic16', 'M PLUS Rounded 1c', sans-serif;
    color: var(--paper);
    background:
      radial-gradient(circle at 80% 0%, #3A4A9C 0%, transparent 45%),
      linear-gradient(180deg, #0C1230 0%, #16204A 55%, #0C1230 100%);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #app{ width:min(94vw, 480px); text-align:center; }

  h1{
    font-size: clamp(18px, 5.5vw, 24px);
    margin: 4px 0 2px;
    color: var(--gold);
    letter-spacing: 2px;
    text-shadow: 2px 2px 0 #000;
  }
  .sub{
    font-size: 11px;
    color: #cfd6f5;
    margin-bottom: 12px;
    letter-spacing: 1px;
  }

  .panel{
    background: linear-gradient(180deg, var(--navy2), var(--navy));
    border-radius: 6px;
    padding: 14px 14px 16px;
    border: 3px solid var(--gold);
    box-shadow: 0 0 0 2px #0C1230 inset, 0 12px 26px rgba(0,0,0,0.5);
    position: relative;
    min-height: 380px;
  }

  .hud{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom: 10px; font-size: 12px;
  }
  .hud-box{
    background: var(--navy);
    border: 2px solid var(--gold-dim);
    border-radius: 4px;
    padding: 5px 10px;
    color: var(--paper);
    letter-spacing: 1px;
  }
  .hud .turns{ border-color: var(--gold); color: var(--gold); font-weight: 700; }
  .hud .turns.low{ color:#FF8A8A; border-color:#FF8A8A; animation: pulse 0.6s infinite alternate; }
  @keyframes pulse{ from{ opacity:1;} to{ opacity:0.5;} }

  .board{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 4px;
    aspect-ratio: 4/3;
    margin-bottom: 10px;
    background: #0C1230;
    padding: 4px;
    border: 2px solid var(--gold-dim);
    border-radius: 4px;
  }
  .cell{
    position: relative;
    display:flex; align-items:center; justify-content:center;
    font-size: clamp(20px, 6.5vw, 28px);
    border: 1px solid rgba(0,0,0,0.25);
  }
  .cell.terrain-tatami{ background: var(--tatami); }
  .cell.terrain-flooring{ background: var(--floor); }
  .cell.terrain-neutral{ background: #2B3A78; }
  .cell.movable{ cursor:pointer; box-shadow: 0 0 0 2px var(--blue-hl) inset; filter: brightness(1.12); }
  .cell.movable:active{ filter: brightness(1.35); }
  .cell .cost-badge{
    position:absolute; top:2px; right:2px;
    background: var(--red); color:#fff; font-size: 9px; font-weight:700;
    padding: 1px 4px; border-radius: 3px; border: 1px solid #7a1f1f;
  }
  .cell .tag{
    position:absolute; bottom:1px; font-size:6.5px; color:#fff;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.6);
    letter-spacing: 0.5px;
  }

  .legend{
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
    font-size: 9px; color:#aab4e0; margin-bottom: 10px;
  }
  .legend .sw{ display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:3px; vertical-align:middle; }

  .msg{
    min-height: 30px;
    font-size: 11.5px;
    color: var(--paper);
    background: var(--navy);
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
    padding: 6px 8px;
    margin-bottom: 10px;
    text-align:left;
    line-height:1.5;
  }

  button{
    font-family: inherit;
    font-weight: 700;
    border: 2px solid var(--gold-dim);
    border-radius: 4px;
    padding: 9px 14px;
    font-size: 12px;
    cursor: pointer;
    background: var(--navy2);
    color: var(--paper);
    letter-spacing: 1px;
  }
  button:active{ filter: brightness(1.2); }
  button.primary{ background: var(--red); border-color:#7a1f1f; color:#fff; }
  button.good{ background: var(--good); border-color:#2c6b42; color:#fff; }

  .footer-row{ display:flex; gap:8px; justify-content:center; }

  .overlay{
    position:absolute; inset:0;
    background: rgba(6,10,28,0.96);
    border-radius: 6px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 16px;
    animation: fadein 0.15s ease-out;
  }
  @keyframes fadein{ from{opacity:0;} to{opacity:1;} }

  .predict-window, .select-window{
    width: 100%;
    background: var(--navy2);
    border: 2px solid var(--gold);
    border-radius: 4px;
    padding: 12px;
  }
  .predict-title, .select-title{
    color: var(--gold); font-size: 12px; letter-spacing: 2px;
    margin-bottom: 8px; border-bottom: 1px dashed var(--gold-dim); padding-bottom: 6px;
  }
  .predict-row{ display:flex; justify-content:space-between; font-size: 11.5px; padding: 3px 0; }
  .predict-row .val{ color: var(--gold); font-weight:700; }
  .predict-flavor{ font-size: 10.5px; color:#cfd6f5; margin: 8px 0 10px; text-align:left; line-height:1.5; }
  .btnrow{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:4px; }

  .overlay .big{ font-size: 32px; margin-bottom: 4px; }
  .overlay h2{ color: var(--gold); font-size: 17px; margin: 2px 0 8px; letter-spacing:2px; }
  .overlay p{ font-size: 11px; line-height:1.7; margin: 0 0 12px; color:#e3e7f7; }

  .char-cards{ display:flex; gap:8px; }
  .char-card{
    flex:1; background: var(--navy); border: 2px solid var(--gold-dim); border-radius: 4px;
    padding: 10px 6px; cursor:pointer; text-align:left;
  }
  .char-card:active{ filter: brightness(1.25); }
  .char-card .icon{ font-size: 30px; text-align:center; display:block; margin-bottom: 4px; }
  .char-card .cname{ font-size: 11px; color: var(--gold); text-align:center; margin-bottom:6px; letter-spacing:1px; }
  .char-card .stat{ font-size: 9.5px; color:#dfe4f7; line-height:1.7; }
  .char-card .stat b{ color:#fff; }
</style>
</head>
<body>
<div id="app">
  <h1>朝の出勤チャレンジ</h1>
  <div class="sub">TURN-BASED MORNING SIMULATION</div>

  <div class="panel">
    <div class="hud">
      <div class="hud-box" id="charBadge">👤 未選択</div>
      <div class="hud-box turns" id="turnsDisplay">残り - T</div>
    </div>

    <div class="board" id="board"></div>

    <div class="legend">
      <div><span class="sw" style="background:var(--tatami);"></span>畳</div>
      <div><span class="sw" style="background:var(--floor);"></span>フローリング</div>
      <div><span class="sw" style="background:var(--red);"></span>消費ターン数</div>
    </div>

    <div class="msg" id="msg">キャラクターを選択してください。</div>
    <div class="footer-row">
      <button onclick="showCharSelect()">👤 キャラを選び直す</button>
      <button onclick="initGame(state.character)">🔄 やり直す</button>
    </div>

    <div class="overlay" id="overlay"></div>
  </div>
</div>

<script>
const COLS = 4, ROWS = 3;
const START = {x:0, y:0};
const GOAL = {x:3, y:2};
const TURN_LIMIT = 7;

// terrain: "tatami" | "flooring" | "neutral"
// type: start | floor | coffee | dog | clutter | phone | ice | food | goal
const TILE_MAP = {
  "0,0": {type:"start",   terrain:"neutral",  emoji:"🛏️", label:"START"},
  "1,0": {type:"floor",   terrain:"tatami",   emoji:"", label:""},
  "2,0": {type:"coffee",  terrain:"tatami",   emoji:"☕", label:"コーヒー"},
  "3,0": {type:"floor",   terrain:"flooring", emoji:"", label:""},
  "0,1": {type:"floor",   terrain:"flooring", emoji:"", label:""},
  "1,1": {type:"dog",     terrain:"flooring", emoji:"🐕", label:"愛犬"},
  "2,1": {type:"clutter", terrain:"flooring", emoji:"🧸", label:"散らかった床"},
  "3,1": {type:"phone",   terrain:"tatami",   emoji:"📱", label:"通知"},
  "0,2": {type:"ice",     terrain:"tatami",   emoji:"❄️", label:"凍った廊下"},
  "1,2": {type:"food",    terrain:"flooring", emoji:"🍙", label:"ご飯"},
  "2,2": {type:"floor",   terrain:"tatami",   emoji:"", label:""},
  "3,2": {type:"goal",    terrain:"neutral",  emoji:"🚪", label:"玄関"},
};

const CHARACTERS = {
  taro: {
    name: "🕺 実家暮らし太郎",
    icon: "🕺",
    costTable: {tatami:1, flooring:2},
    statLines: [
      "畳 <b>コスト1</b> / フローリング <b>コスト2</b>",
      "🐕 犬：なでても避けても <b>コスト±0</b>",
      "🍙 ご飯：実家の朝食で <b>回復多め</b>"
    ],
    dog: {
      engageCost:0, avoidCost:0,
      engageLabel:"なでる(コストなし)", avoidLabel:"またぐ(コストなし)",
      flavorEngage:"慣れたもんだと言わんばかりに片手でなでる。",
      flavorAvoid:"ひょいっと華麗にまたいで進む。"
    },
    food: {
      eatCost:1, recover:3, label:"祖母特製の朝食",
      eatLabel:"食べる(消費1T・回復3T)", skipLabel:"我慢する(消費なし)",
      flavorEat:"「残さず食べなさい！」祖母の愛のパワーで、体力(ターン)が大きく回復した。",
      flavorSkip:"もったいないけど、今日は諦めた。"
    }
  },
  ol: {
    name: "💃 一人暮らしOLちゃん",
    icon: "💃",
    costTable: {flooring:1, tatami:2},
    statLines: [
      "フローリング <b>コスト1</b> / 畳 <b>コスト2</b>",
      "🐕 犬：なでても避けても <b>+1T</b>",
      "🍙 ご飯：コンビニおにぎりで <b>回復わずか</b>"
    ],
    dog: {
      engageCost:1, avoidCost:1,
      engageLabel:"なでる(+1T)", avoidLabel:"避けて通る(+1T)",
      flavorEngage:"犬は少し苦手…なでたら癒されたが時間を食った。",
      flavorAvoid:"犬をよけて遠回りしたら、思ったより時間がかかった。"
    },
    food: {
      eatCost:1, recover:1, label:"コンビニおにぎり",
      eatLabel:"食べる(消費1T・回復1T)", skipLabel:"我慢する(消費なし)",
      flavorEat:"美味しいけど、別に元気が湧いてくるわけではない…。",
      flavorSkip:"小腹は空いたが、今は我慢。"
    }
  }
};

const EVENTS = {
  coffee: {
    icon:"☕", name:"コーヒーの誘惑",
    text:"淹れたてのコーヒーが香っている…一口だけ飲んでいく？",
    yes:"飲む(+1T消費)", no:"我慢する(追加消費なし)",
    flavor:"はぁ〜…しあわせ…って、時間ないんだった！",
    predictLabel:"出勤成功率", predictVal:"62%", dmgLabel:"遅刻ダメージ", dmgVal:"+1T"
  },
  phone: {
    icon:"📱", name:"スマホ通知",
    text:"スマホが鳴った。通知、見る？",
    yes:"見る(+1T消費)", no:"見ずに進む(追加消費なし)",
    flavor:"『いいね』が3件。人生で一番どうでもいい3件。",
    predictLabel:"出勤成功率", predictVal:"41%", dmgLabel:"遅刻ダメージ", dmgVal:"+1T"
  }
};

let state = {};

function key(x,y){ return x+","+y; }
function tileAt(x,y){ return TILE_MAP[key(x,y)] || {type:"floor", terrain:"neutral", emoji:"", label:""}; }
function isAdjacent(a,b){ const dx=Math.abs(a.x-b.x), dy=Math.abs(a.y-b.y); return (dx+dy)===1; }
function CH(){ return CHARACTERS[state.character]; }

function moveCost(tile){
  if(tile.type === "start") return 0;
  if(tile.type === "goal") return 1;
  if(tile.type === "clutter") return 2;
  return CH().costTable[tile.terrain] || 1;
}

function showCharSelect(){
  const overlay = document.getElementById("overlay");
  overlay.style.display = "flex";
  overlay.innerHTML = `
    <div class="select-window">
      <div class="select-title">👤 キャラクター選択</div>
      <div class="char-cards">
        ${Object.keys(CHARACTERS).map(k => {
          const c = CHARACTERS[k];
          return `<div class="char-card" onclick="initGame('${k}')">
            <span class="icon">${c.icon}</span>
            <div class="cname">${c.name}</div>
            <div class="stat">${c.statLines.map(s=>"・"+s).join("<br>")}</div>
          </div>`;
        }).join("")}
      </div>
    </div>
  `;
}

function initGame(characterKey){
  state = {
    character: characterKey,
    player: {...START},
    turnsUsed: 0,
    resolvedEvents: new Set(),
    gameOver: false,
    lastDir: null,
  };
  document.getElementById("overlay").style.display = "none";
  document.getElementById("charBadge").textContent = CH().icon + " " + CH().name.replace(/^.. /,"");
  document.getElementById("msg").textContent = "隣接マスをタップして移動。数字は消費ターン数(キャラで変動)。";
  render();
}

function render(){
  const board = document.getElementById("board");
  board.innerHTML = "";
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      const cell = document.createElement("div");
      const tile = tileAt(x,y);
      cell.className = "cell terrain-" + tile.terrain;
      const isPlayer = state.player.x===x && state.player.y===y;
      const movable = !state.gameOver && !isPlayer && isAdjacent(state.player,{x,y});

      if(movable){
        cell.classList.add("movable");
        const badge = document.createElement("div");
        badge.className = "cost-badge";
        badge.textContent = moveCost(tile);
        cell.appendChild(badge);
        cell.onclick = () => tryMove(x,y);
      }

      const emojiSpan = document.createElement("div");
      emojiSpan.textContent = isPlayer ? CH().icon : tile.emoji;
      cell.appendChild(emojiSpan);

      if(!isPlayer && tile.label){
        const tag = document.createElement("div");
        tag.className = "tag";
        tag.textContent = tile.label;
        cell.appendChild(tag);
      }
      if(!isPlayer && state.resolvedEvents.has(key(x,y)) &&
         (tile.type==="coffee"||tile.type==="dog"||tile.type==="phone"||tile.type==="food")){
        cell.style.opacity = "0.4";
      }

      board.appendChild(cell);
    }
  }

  const remaining = TURN_LIMIT - state.turnsUsed;
  const td = document.getElementById("turnsDisplay");
  td.textContent = "残り " + Math.max(remaining,0) + " T";
  td.classList.toggle("low", remaining <= 2);
}

function tryMove(x,y){
  if(state.gameOver) return;
  const from = {...state.player};
  const tile = tileAt(x,y);

  state.lastDir = {dx: x-from.x, dy: y-from.y};
  state.player = {x,y};
  state.turnsUsed += moveCost(tile);
  render();

  if(tile.type === "ice"){
    const nx = x + state.lastDir.dx, ny = y + state.lastDir.dy;
    if(nx>=0 && nx<COLS && ny>=0 && ny<ROWS){
      setTimeout(() => {
        state.player = {x:nx, y:ny};
        document.getElementById("msg").textContent = "❄️ つるっと滑って、もう1マス無料で進んだ！";
        render();
        afterMoveResolve(nx, ny);
      }, 250);
      return;
    }
  }
  afterMoveResolve(x,y);
}

function afterMoveResolve(x,y){
  const tile = tileAt(x,y);
  const evKey = key(x,y);

  if((tile.type==="coffee"||tile.type==="phone") && !state.resolvedEvents.has(evKey)){
    showPredictEvent(tile.type, evKey);
    return;
  }
  if(tile.type==="dog" && !state.resolvedEvents.has(evKey)){
    showDogEvent(evKey);
    return;
  }
  if(tile.type==="food" && !state.resolvedEvents.has(evKey)){
    showFoodEvent(evKey);
    return;
  }
  if(tile.type === "clutter"){
    document.getElementById("msg").textContent = "🧸 散らかった床…足の踏み場もなく、2ターン分の時間を消費した。";
  }
  checkEnd();
}

function showPredictEvent(type, evKey){
  const ev = EVENTS[type];
  const overlay = document.getElementById("overlay");
  overlay.style.display = "flex";
  overlay.innerHTML = `
    <div class="predict-window">
      <div class="predict-title">⚔ ${ev.icon} エンカウント：${ev.name}</div>
      <div class="predict-row"><span>${ev.predictLabel}</span><span class="val">${ev.predictVal}</span></div>
      <div class="predict-row"><span>${ev.dmgLabel}(関与時)</span><span class="val">${ev.dmgVal}</span></div>
      <div class="predict-flavor">${ev.text}</div>
      <div class="btnrow">
        <button class="primary" onclick="resolveGenericEvent('${type}','${evKey}', true)">${ev.yes}</button>
        <button onclick="resolveGenericEvent('${type}','${evKey}', false)">${ev.no}</button>
      </div>
    </div>
  `;
}

function resolveGenericEvent(type, evKey, engaged){
  state.resolvedEvents.add(evKey);
  document.getElementById("overlay").style.display = "none";
  if(engaged){
    state.turnsUsed += 1;
    document.getElementById("msg").textContent = EVENTS[type].flavor;
  } else {
    document.getElementById("msg").textContent = "先を急ぐことにした。";
  }
  render();
  checkEnd();
}

function showDogEvent(evKey){
  const d = CH().dog;
  const overlay = document.getElementById("overlay");
  overlay.style.display = "flex";
  overlay.innerHTML = `
    <div class="predict-window">
      <div class="predict-title">🐕 エンカウント：愛犬</div>
      <div class="predict-flavor">足元に愛犬がすり寄ってきた。どうする？</div>
      <div class="btnrow">
        <button class="primary" onclick="resolveDogEvent('${evKey}', true)">${d.engageLabel}</button>
        <button onclick="resolveDogEvent('${evKey}', false)">${d.avoidLabel}</button>
      </div>
    </div>
  `;
}

function resolveDogEvent(evKey, engaged){
  const d = CH().dog;
  state.resolvedEvents.add(evKey);
  document.getElementById("overlay").style.display = "none";
  state.turnsUsed += engaged ? d.engageCost : d.avoidCost;
  document.getElementById("msg").textContent = engaged ? d.flavorEngage : d.flavorAvoid;
  render();
  checkEnd();
}

function showFoodEvent(evKey){
  const f = CH().food;
  const overlay = document.getElementById("overlay");
  overlay.style.display = "flex";
  overlay.innerHTML = `
    <div class="predict-window">
      <div class="predict-title">🍙 ${f.label}</div>
      <div class="predict-row"><span>消費</span><span class="val">${f.eatCost}T</span></div>
      <div class="predict-row"><span>回復</span><span class="val">${f.recover}T</span></div>
      <div class="predict-flavor">食べていく？</div>
      <div class="btnrow">
        <button class="good" onclick="resolveFoodEvent('${evKey}', true)">${f.eatLabel}</button>
        <button onclick="resolveFoodEvent('${evKey}', false)">${f.skipLabel}</button>
      </div>
    </div>
  `;
}

function resolveFoodEvent(evKey, engaged){
  const f = CH().food;
  state.resolvedEvents.add(evKey);
  document.getElementById("overlay").style.display = "none";
  if(engaged){
    state.turnsUsed += f.eatCost;
    state.turnsUsed -= f.recover;
    if(state.turnsUsed < 0) state.turnsUsed = 0;
    document.getElementById("msg").textContent = f.flavorEat;
  } else {
    document.getElementById("msg").textContent = f.flavorSkip;
  }
  render();
  checkEnd();
}

function checkEnd(){
  const remaining = TURN_LIMIT - state.turnsUsed;
  if(state.player.x === GOAL.x && state.player.y === GOAL.y){
    state.gameOver = true;
    showResult(true, remaining);
    return;
  }
  if(remaining <= 0){
    state.gameOver = true;
    showResult(false, 0);
  }
}

function showResult(won, remaining){
  const overlay = document.getElementById("overlay");
  overlay.style.display = "flex";
  if(won){
    overlay.innerHTML = `
      <div class="big">🎉</div>
      <h2>出勤成功</h2>
      <p>${CH().icon} ${CH().name} は残り ${remaining} ターンで玄関に到達。<br>評価：<b>${remaining>=2 ? "S(余裕の勝利)" : "C(ギリギリセーフ)"}</b></p>
      <div class="btnrow">
        <button class="good" onclick="initGame(state.character)">🔁 もう一度</button>
        <button onclick="showCharSelect()">👤 キャラを変える</button>
      </div>
    `;
  } else {
    overlay.innerHTML = `
      <div class="big">💥</div>
      <h2>大遅刻</h2>
      <p>${CH().icon} ${CH().name} は時間切れ。玄関にたどり着けなかった。<br>上司「…で？」</p>
      <div class="btnrow">
        <button class="primary" onclick="initGame(state.character)">🔁 リベンジする</button>
        <button onclick="showCharSelect()">👤 キャラを変える</button>
      </div>
    `;
  }
}

showCharSelect();
</script>
</body>
</html>
